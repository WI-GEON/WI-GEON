<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">WI-GEON — Unity Client Developer</title>
  <desc id="desc">A modern dark banner inspired by a game engine scene view.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D12"/><stop offset="0.58" stop-color="#101720"/><stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58D6A5"/><stop offset="1" stop-color="#78A8FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58D6A5" stop-opacity="0.2"/><stop offset="1" stop-color="#58D6A5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8AA0B8" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:.9 } }
      .signal { animation: pulse 3s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { .signal { animation:none } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="164" cy="181" r="210" fill="url(#halo)"/>
    <circle cx="1100" cy="110" r="170" fill="#688BFF" opacity="0.035"/>
    <rect width="1200" height="38" fill="#080C11" opacity="0.88"/>
    <circle cx="22" cy="19" r="4" fill="#58D6A5"/>
    <text x="36" y="23" class="mono" font-size="12" fill="#91A1B2">SCENE</text>
    <text x="94" y="23" class="mono" font-size="12" fill="#526171">GAME</text>
    <text x="143" y="23" class="mono" font-size="12" fill="#526171">PROFILER</text>
    <text x="1138" y="23" text-anchor="end" class="mono" font-size="11" fill="#526171">WI-GEON / PORTFOLIO</text>
    <g transform="translate(128 185)">
      <circle r="76" fill="#0A1017" stroke="#263442" stroke-width="2"/>
      <circle r="62" fill="none" stroke="#58D6A5" stroke-opacity="0.16"/>
      <path d="M0-42 40-19 40 27 0 50-40 27-40-19Z" fill="#111B25" stroke="url(#accent)" stroke-width="3"/>
      <path d="M0-42V4M40-19 0 4-40-19M0 4V50" fill="none" stroke="#88A0B8" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M-22-18-8 25 0 4 8 25 22-18" fill="none" stroke="#E8F0F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="-50" r="5" fill="#58D6A5" class="signal"/>
    </g>
    <g transform="translate(250 104)">
      <text class="mono" font-size="13" letter-spacing="3" fill="#58D6A5">UNITY CLIENT DEVELOPER</text>
      <text y="78" class="sans" font-size="72" font-weight="760" letter-spacing="-2" fill="#F1F5F9">WI-GEON</text>
      <rect y="101" width="420" height="3" rx="1.5" fill="url(#accent)"/>
      <text y="138" class="sans" font-size="17" fill="#9EADBC">Readable systems. Testable gameplay. Measured performance.</text>
      <g transform="translate(0 170)" class="mono" font-size="11" letter-spacing="1.2">
        <rect width="112" height="27" rx="13.5" fill="#111C25" stroke="#2B3C49"/>
        <circle cx="17" cy="13.5" r="3" fill="#58D6A5"/><text x="29" y="17" fill="#B9C6D2">ARCHITECTURE</text>
        <g transform="translate(124)">
          <rect width="104" height="27" rx="13.5" fill="#111C25" stroke="#2B3C49"/>
          <circle cx="17" cy="13.5" r="3" fill="#6FA6FF"/><text x="29" y="17" fill="#B9C6D2">TESTABILITY</text>
        </g>
        <g transform="translate(240)">
          <rect width="112" height="27" rx="13.5" fill="#111C25" stroke="#2B3C49"/>
          <circle cx="17" cy="13.5" r="3" fill="#C493FF"/><text x="29" y="17" fill="#B9C6D2">PERFORMANCE</text>
        </g>
      </g>
    </g>
    <g transform="translate(940 188)">
      <circle r="94" fill="#0A1017" fill-opacity="0.6" stroke="#263442"/>
      <circle r="66" fill="none" stroke="#78A8FF" stroke-opacity="0.14"/>
      <path d="M-95 58 0 2 95 58M-95 58 0 112 95 58M0 2V112" fill="none" stroke="#71869A" stroke-opacity="0.24"/>
      <path d="M0-68V42M-68 0H68" stroke="#71869A" stroke-opacity="0.22"/>
      <path d="M0-38 36-17 36 25 0 46-36 25-36-17Z" fill="#101923" stroke="#78A8FF" stroke-opacity="0.7" stroke-width="2"/>
      <path d="M0-38V4M36-17 0 4-36-17M0 4V46" fill="none" stroke="#58D6A5" stroke-opacity="0.72"/>
      <circle cx="0" cy="4" r="5" fill="#F1F5F9"/>
      <line x1="0" y1="4" x2="67" y2="4" stroke="#F06464" stroke-width="2"/><polygon points="76,4 64,-2 64,10" fill="#F06464"/>
      <line x1="0" y1="4" x2="0" y2="-63" stroke="#58D674" stroke-width="2"/><polygon points="0,-72 -6,-60 6,-60" fill="#58D674"/>
      <line x1="0" y1="4" x2="-38" y2="45" stroke="#5C9EFF" stroke-width="2"/><polygon points="-45,53 -41,40 -32,48" fill="#5C9EFF"/>
    </g>
    <text x="1162" y="334" text-anchor="end" class="mono" font-size="10" letter-spacing="1.5" fill="#435363">BUILD · TEST · PROFILE</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#263442" stroke-width="2"/>
</svg>
