# Velog RSS를 읽어 README의 DEV LOG 영역을 최신 글로 갱신합니다.
name: Latest Velog Posts

on:
  schedule:
    - cron: "0 */6 * * *"  # 6시간마다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://v2.velog.io/rss/w_wgeon"
          max_post_count: 5
